<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Signal — Rakeeeen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0908;
      color: #e9e2d2;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      filter: grayscale(1) contrast(1.1);
    }

    /* Film grain canvas */
    #grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: screen;
    }

    /* Sprocket holes */
    .sprocket {
      position: fixed;
      top: 0; bottom: 0;
      width: 48px;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 20px 0;
      z-index: 20;
    }
    .sprocket.left { left: 0; }
    .sprocket.right { right: 0; }
    .hole {
      width: 20px; height: 14px;
      background: #1a1a1a;
      border: 1.5px solid #333;
      border-radius: 3px;
    }

    /* Film top/bottom strips */
    .film-strip {
      position: fixed;
      left: 48px; right: 48px;
      height: 40px;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 15;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: rgba(200,200,200,0.35);
    }
    .film-strip.top { top: 0; border-bottom: 1px solid #2a2a2a; }
    .film-strip.bottom { bottom: 0; border-top: 1px solid #2a2a2a; }
    .film-strip span { margin-left: auto; }

    /* Main content */
    .content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 0 80px;
      animation: flicker 4s infinite;
    }

    .no-signal {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      color: #e0e0e0;
      text-shadow:
        2px 0 0 rgba(255,0,0,0.3),
        -2px 0 0 rgba(0,200,255,0.3),
        0 0 40px rgba(200,200,200,0.1);
      margin-bottom: 0.5rem;
      animation: glitch 6s infinite;
    }

    .subtitle {
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      letter-spacing: 0.5em;
      opacity: 0.45;
      margin-bottom: 3rem;
      text-transform: uppercase;
    }

    /* Static bars */
    .static-bars {
      width: 280px;
      margin: 0 auto 3rem;
    }
    .bar {
      height: 6px;
      background: rgba(233,226,210,0.5);
      margin-bottom: 4px;
    }

    .description {
      font-size: 0.85rem;
      opacity: 0.45;
      letter-spacing: 0.15em;
      line-height: 2;
      max-width: 400px;
      margin: 0 auto 2.5rem;
      text-transform: uppercase;
    }

    button {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.7rem 2rem;
      background: transparent;
      color: #e9e2d2;
      border: 1.5px solid rgba(233,226,210,0.5);
      cursor: pointer;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    button:hover {
      background: rgba(233,226,210,0.1);
      border-color: #e9e2d2;
    }

    @keyframes glitch {
      0%, 90%, 100% {
        transform: translate(0);
        text-shadow: 2px 0 0 rgba(255,0,0,0.3), -2px 0 0 rgba(0,200,255,0.3);
      }
      91% { transform: translate(-3px, 1px); text-shadow: 4px 0 0 rgba(255,0,0,0.5), -4px 0 0 rgba(0,200,255,0.5); }
      92% { transform: translate(3px, -1px); }
      93% { transform: translate(-2px, 2px); clip-path: inset(20% 0 30% 0); }
      94% { transform: translate(0); text-shadow: 2px 0 0 rgba(255,0,0,0.3), -2px 0 0 rgba(0,200,255,0.3); }
    }
    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.7; }
      97% { opacity: 1; }
      98% { opacity: 0.5; }
      99% { opacity: 0.9; }
    }
  </style>
</head>
<body>

  <canvas id="grain"></canvas>

  <!-- Sprocket holes -->
  <div class="sprocket left">
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div>
  </div>
  <div class="sprocket right">
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div>
  </div>

  <!-- Film strips -->
  <div class="film-strip top">
    RAKEEEEN &nbsp;&nbsp;◆&nbsp;&nbsp; FRAME 404
    <span>○ ○ ●</span>
  </div>
  <div class="film-strip bottom">
    CONNECTION LOST — SIGNAL INTERRUPTED
  </div>

  <!-- Content -->
  <div class="content">
    <div class="no-signal">NO SIGNAL</div>
    <div class="subtitle">connection lost</div>

    <div class="static-bars">
      <div class="bar" style="opacity:0.8"></div>
      <div class="bar" style="opacity:0.4"></div>
      <div class="bar" style="opacity:0.6"></div>
      <div class="bar" style="opacity:0.3"></div>
      <div class="bar" style="opacity:0.7"></div>
      <div class="bar" style="opacity:0.2"></div>
      <div class="bar" style="opacity:0.9"></div>
      <div class="bar" style="opacity:0.5"></div>
    </div>

    <p class="description">
      The network has disappeared.<br>
      Please check your connection<br>
      and try again.
    </p>

    <button onclick="window.location.reload()">Try Again</button>
  </div>

  <script>
    // Film grain animation
    const canvas = document.getElementById('grain');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let frame = 0;
    function drawFilm() {
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grain
      const imageData = ctx.createImageData(canvas.width, canvas.height);
      for (let i = 0; i < imageData.data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 80;
        imageData.data[i] = 128 + noise;
        imageData.data[i+1] = 128 + noise;
        imageData.data[i+2] = 128 + noise;
        imageData.data[i+3] = Math.random() * 60 + 20;
      }
      ctx.putImageData(imageData, 0, 0);

      // Film scratches
      for (let s = 0; s < 3; s++) {
        if (Math.random() > 0.6) {
          const x = Math.random() * canvas.width;
          ctx.strokeStyle = `rgba(255,255,255,${Math.random() * 0.6 + 0.2})`;
          ctx.lineWidth = Math.random() * 1.5 + 0.5;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          for (let y = 0; y < canvas.height; y += 20) {
            ctx.lineTo(x + (Math.random() - 0.5) * 2, y);
          }
          ctx.stroke();
        }
      }

      requestAnimationFrame(drawFilm);
    }
    drawFilm();
  </script>
</body>
</html>
